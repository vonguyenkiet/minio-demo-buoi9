# upstream-docker-resolve.conf – DNS resolve động (NGINX >= 1.27.3)
# Tham số `resolve` cho phép NGINX re-resolve DNS khi IP container thay đổi
# resolver nằm trong upstream block được hỗ trợ chính thức từ NGINX 1.27.3+
upstream backend_pool {
    zone backend_pool 64k;
    resolver 127.0.0.11 valid=5s;
    server backend-1:3000 resolve;
    server backend-2:3000 resolve;
}
