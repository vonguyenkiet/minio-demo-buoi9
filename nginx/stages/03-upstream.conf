##############################################################
# Stage 03-upstream – Upstream pool + load balancing + DEMO proxy_pass variants
# Môi trường: NGINX native (upstream-native.conf) hoặc Docker (upstream-docker.conf)
# Upstream được inject qua mount: /etc/nginx/shop/upstream.conf
# Kích hoạt Docker: NGINX_STAGE=03-upstream docker compose up -d --force-recreate nginx
##############################################################

log_format shop_main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'rt=$request_time up=$upstream_addr ust=$upstream_status inst=$upstream_http_x_instance';

# Upstream pool được định nghĩa trong file riêng (inject qua mount)
include /etc/nginx/shop/upstream.conf;

server {
    listen 80;
    server_name shop.local;

    access_log /var/log/nginx/shop.access.log shop_main;
    error_log  /var/log/nginx/shop.error.log warn;

    root /var/www/shop;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/ đến upstream pool – KHÔNG có URI sau proxy_pass
    location /api/ {
        proxy_pass         http://backend_pool;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
        proxy_buffering    off;
        proxy_http_version 1.0;
    }

    # Proxy /health và /health/db đến upstream (nằm ngoài /api/)
    location ~ ^/health(/db)?$ {
        proxy_pass         http://backend_pool;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
        proxy_buffering    off;
        proxy_http_version 1.0;
    }

    # ============================================================
    # DEMO ONLY – Bảng so sánh proxy_pass variants
    # Đo bằng: scripts/pp-variants-test.sh
    # ============================================================

    # Variant A: không có URI → backend nhận path đầy đủ từ client
    location /pp/nouri/ {
        proxy_pass         http://backend_pool;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
        proxy_buffering    off;
        proxy_http_version 1.0;
    }

    # Variant B: URI là "/" → NGINX strip prefix, backend nhận phần còn lại
    location /pp/slash/ {
        proxy_pass         http://backend_pool/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
        proxy_buffering    off;
        proxy_http_version 1.0;
    }

    # Variant C: URI là "/api/" → NGINX strip prefix và thêm "/api/"
    location /pp/apiuri/ {
        proxy_pass         http://backend_pool/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
        proxy_buffering    off;
        proxy_http_version 1.0;
    }

    # Variant D: location không có "/" cuối → URI thay thế, tạo double slash
    location /pp/bad {
        proxy_pass         http://backend_pool/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
        proxy_buffering    off;
        proxy_http_version 1.0;
    }

    # NGINX health check (không log)
    location /nginx-health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx","stage":"03-upstream"}\n';
        add_header Content-Type application/json;
    }
}
