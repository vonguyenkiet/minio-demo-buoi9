##############################################################
# Stage 04-bodysize – Như 03 nhưng thêm giới hạn body 20m cho /api/
# Không có khối DEMO proxy_pass variants
# Môi trường: NGINX native và Docker
##############################################################

log_format shop_main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'rt=$request_time up=$upstream_addr ust=$upstream_status inst=$upstream_http_x_instance';

include /etc/nginx/shop/upstream.conf;

server {
    listen 80;
    server_name shop.local;

    access_log /var/log/nginx/shop.access.log shop_main;
    error_log  /var/log/nginx/shop.error.log warn;

    root /var/www/shop;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # NGINX giới hạn 20m – backend giới hạn 5m cho /api/upload-test
        # Request 6–20m đến /api/upload-test → backend trả 413 source:'backend'
        # Request >20m → NGINX trả 413 (HTML, không có X-Instance)
        client_max_body_size 20m;

        proxy_pass         http://backend_pool;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
        proxy_buffering    off;
        proxy_http_version 1.0;
    }

    location ~ ^/health(/db)?$ {
        proxy_pass         http://backend_pool;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
        proxy_buffering    off;
        proxy_http_version 1.0;
    }

    location /nginx-health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx","stage":"04-bodysize"}\n';
        add_header Content-Type application/json;
    }
}
