##############################################################
# Stage 01-static – Chỉ phục vụ file tĩnh (không proxy)
# Môi trường: NGINX native trong WSL
# Kích hoạt: cp nginx/stages/01-static.conf /etc/nginx/sites-available/shop.local
##############################################################

log_format shop_static '$remote_addr [$time_local] "$request" $status $body_bytes_sent rt=$request_time';

server {
    listen 80;
    server_name shop.local;

    access_log /var/log/nginx/shop.access.log shop_static;
    error_log  /var/log/nginx/shop.error.log warn;

    root /var/www/shop;
    index index.html;

    # SPA fallback: file thật → thư mục → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # NGINX health check (không log)
    location /nginx-health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx","stage":"01-static"}\n';
        add_header Content-Type application/json;
    }
}
