##############################################################
# Stage 02-proxy – Static + reverse proxy đến backend đơn
# Môi trường: NGINX native trong WSL
# Backend cố định: 127.0.0.1:3001
# Kích hoạt: cp nginx/stages/02-proxy.conf /etc/nginx/sites-available/shop.local
##############################################################

log_format shop_proxy '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                      'rt=$request_time up=$upstream_addr ust=$upstream_status';

server {
    listen 80;
    server_name shop.local;

    access_log /var/log/nginx/shop.access.log shop_proxy;
    error_log  /var/log/nginx/shop.error.log warn;

    root /var/www/shop;
    index index.html;

    # File tĩnh: SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy đến backend đơn – KHÔNG có URI sau proxy_pass
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
        proxy_buffering    off;
        proxy_http_version 1.0;
    }

    # Proxy /health và /health/db đến backend (nằm ngoài /api/)
    location ~ ^/health(/db)?$ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
        proxy_buffering    off;
        proxy_http_version 1.0;
    }

    # NGINX health check (không log)
    location /nginx-health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx","stage":"02-proxy"}\n';
        add_header Content-Type application/json;
    }
}
