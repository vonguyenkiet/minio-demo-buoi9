##############################################################
# Stage 05-https – Redirect HTTP→HTTPS + TLS termination
# ĐIỀU KIỆN: certs/active/shop.local.crt và .key phải tồn tại trước khi up
# Chạy: scripts/gen-certs.sh && scripts/use-cert.sh selfsigned docker
# Môi trường: Docker (native tuỳ chọn)
##############################################################

log_format shop_main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'rt=$request_time up=$upstream_addr ust=$upstream_status inst=$upstream_http_x_instance';

include /etc/nginx/shop/upstream.conf;

# Server HTTP – chỉ redirect sang HTTPS
server {
    listen 80;
    server_name shop.local;

    access_log /var/log/nginx/shop.access.log shop_main;
    error_log  /var/log/nginx/shop.error.log warn;

    return 301 https://shop.local$request_uri;
}

# Server HTTPS – phục vụ app thật
server {
    listen 443 ssl;
    server_name shop.local;

    # Chứng chỉ TLS (mount từ certs/active/)
    ssl_certificate     /etc/nginx/certs/shop.local.crt;
    ssl_certificate_key /etc/nginx/certs/shop.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/shop.access.log shop_main;
    error_log  /var/log/nginx/shop.error.log warn;

    root /var/www/shop;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 20m;

        proxy_pass         http://backend_pool;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
        proxy_buffering    off;
        proxy_http_version 1.0;
    }

    location ~ ^/health(/db)?$ {
        proxy_pass         http://backend_pool;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
        proxy_buffering    off;
        proxy_http_version 1.0;
    }

    location /nginx-health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx","stage":"05-https"}\n';
        add_header Content-Type application/json;
    }
}
