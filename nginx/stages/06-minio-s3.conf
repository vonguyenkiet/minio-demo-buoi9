##############################################################
# Stage 06-minio-s3 – NGINX config cho Buoi 9: MinIO / Object Storage S3
# Ho tro 2 domain:
# 1. shop.local (va localhost): Phuc vu React Frontend + Backend API (/api/)
# 2. minio.shop.local: Reverse Proxy den MinIO S3 API (minio:9000)
##############################################################

log_format shop_buoi9 '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                      'rt=$request_time up=$upstream_addr ust=$upstream_status host="$host"';

# Upstream pool ket noi toi 2 backend instances
include /etc/nginx/shop/upstream.conf;

# ============================================================
# Server 1: Ứng dụng Web Shop Catalog + Storage GUI
# Hostname: shop.local (hoặc localhost)
# ============================================================
server {
    listen 80 default_server;
    server_name shop.local localhost;
    charset utf-8;

    access_log /var/log/nginx/shop.access.log shop_buoi9;
    error_log  /var/log/nginx/shop.error.log warn;

    root /var/www/shop;
    index index.html;

    # Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy – hỗ trợ upload file lên đến 25MB
    location /api/ {
        client_max_body_size 25m;

        proxy_pass         http://backend_pool;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;
        proxy_buffering    off;
        proxy_http_version 1.1;
    }

    # Health check routes
    location ~ ^/health(/db)?$ {
        proxy_pass         http://backend_pool;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
        proxy_buffering    off;
        proxy_http_version 1.1;
    }

    # NGINX internal healthcheck
    location /nginx-health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx","stage":"06-minio-s3"}\n';
        add_header Content-Type application/json;
    }
}

# ============================================================
# Server 2: MinIO S3 API Reverse Proxy
# Hostname: minio.shop.local
# QUAN TRỌNG: $http_host giữ nguyên hostname minio.shop.local
# để chữ ký AWS S3 Signature V4 của Presigned URL khớp 100%!
# ============================================================
server {
    listen 80;
    server_name minio.shop.local;
    charset utf-8;

    access_log /var/log/nginx/minio.access.log shop_buoi9;
    error_log  /var/log/nginx/minio.error.log warn;

    # Cho phép upload object lớn qua S3 API nếu cần
    client_max_body_size 50m;

    location / {
        proxy_pass http://minio:9000;

        # BẮT BUỘC để không làm hỏng AWS S3 Signature V4
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình stream cho S3 API
        proxy_connect_timeout 300;
        proxy_send_timeout    300;
        proxy_read_timeout    300;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        chunked_transfer_encoding off;
        proxy_buffering       off;
        proxy_request_buffering off;
    }
}
